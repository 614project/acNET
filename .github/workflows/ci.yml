name: Build and Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build
      run: dotnet build --configuration Release

    - name: Test
      run: dotnet test tests/acNET.Tests --configuration Release
      env:
        # 저장소 시크릿이 있으면 실제 solved.ac API 테스트도 실행합니다. (없으면 건너뜀)
        SOLVEDAC_CLIENT_ID: ${{ secrets.SOLVEDAC_CLIENT_ID }}
        SOLVEDAC_CLIENT_SECRET: ${{ secrets.SOLVEDAC_CLIENT_SECRET }}

    - name: Native AOT check
      run: |
        dotnet publish tests/acNET.AotProbe --configuration Release
        tests/acNET.AotProbe/bin/Release/net10.0/linux-x64/publish/acNET.AotProbe
