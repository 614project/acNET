name: Build and Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build
      run: dotnet build --configuration Release

    - name: Test
      run: dotnet test tests/acNET.Tests --configuration Release

    - name: Native AOT check
      run: |
        dotnet publish tests/acNET.AotProbe --configuration Release
        tests/acNET.AotProbe/bin/Release/net10.0/linux-x64/publish/acNET.AotProbe
