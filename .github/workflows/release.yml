name: Release

# NuGet 에 패키지를 배포하고 GitHub 릴리스를 만듭니다.
#
# - Actions 탭에서 이 워크플로를 직접 실행(workflow_dispatch)하거나, v1.2.3 형식의 태그를 푸시하면 실행됩니다.
# - 배포할 버전은 acNET.csproj 의 <Version> 입니다. 태그로 실행했다면 태그와 버전이 같아야 합니다.
# - NuGet 은 API 키 대신 Trusted Publishing(OIDC)으로 인증합니다.
#   nuget.org 의 Trusted Publishing 정책(저장소 614project/acNET, 워크플로 release.yml, 환경 production)과
#   이 파일의 이름과 environment 가 일치해야 하므로 바꿀 때는 정책도 함께 바꿔주세요.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write   # NuGet Trusted Publishing (GitHub OIDC 토큰 발급)
      contents: write   # GitHub 릴리스와 태그 생성

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Read version
      id: version
      run: |
        version=$(dotnet msbuild acNET.csproj -getProperty:Version)
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "배포할 버전: $version"
        if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
          echo "::error::태그($GITHUB_REF_NAME)와 acNET.csproj 의 버전(v$version)이 다릅니다."
          exit 1
        fi

    - name: Build
      run: dotnet build --configuration Release

    - name: Test
      run: dotnet test tests/acNET.Tests --configuration Release
      env:
        SOLVEDAC_CLIENT_ID: ${{ secrets.SOLVEDAC_CLIENT_ID }}
        SOLVEDAC_CLIENT_SECRET: ${{ secrets.SOLVEDAC_CLIENT_SECRET }}

    - name: Native AOT check
      run: |
        dotnet publish tests/acNET.AotProbe --configuration Release
        tests/acNET.AotProbe/bin/Release/net10.0/linux-x64/publish/acNET.AotProbe

    - name: Pack
      run: dotnet pack acNET.csproj --configuration Release --no-build --output ./nupkg

    - name: NuGet login (Trusted Publishing)
      id: login
      uses: NuGet/login@v1
      with:
        user: jyunrcaea   # nuget.org 에서 Trusted Publishing 정책을 만든 계정

    - name: Push to NuGet
      run: >
        dotnet nuget push "./nupkg/acNET.${{ steps.version.outputs.version }}.nupkg"
        --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
        --source https://api.nuget.org/v3/index.json
        --skip-duplicate

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        notes=".github/release-notes/$VERSION.md"
        if gh release view "v$VERSION" > /dev/null 2>&1; then
          echo "릴리스 v$VERSION 이 이미 있어서 만들지 않습니다."
        elif [[ -f "$notes" ]]; then
          gh release create "v$VERSION" "./nupkg/acNET.$VERSION.nupkg" --target "$GITHUB_SHA" --title "acNET $VERSION" --notes-file "$notes"
        else
          gh release create "v$VERSION" "./nupkg/acNET.$VERSION.nupkg" --target "$GITHUB_SHA" --title "acNET $VERSION" --generate-notes
        fi
